<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/play.css">
<title>PocketEmu – Play</title>
</head>
<body>
<div id="wrap"><div id="game"></div></div>

<div id="bar">
  <button id="bBack" title="Save &amp; exit">✕</button>
  <button id="bSave" title="Save state">💾</button>
  <button id="bLoad" title="Load state">📂</button>
  <button id="bTV" title="TV / controller mode">📺</button>
  <button id="bHide" title="Hide bar">‹</button>
</div>
<button id="bShow" hidden>›</button>

<dialog id="dlgSlots">
  <form method="dialog">
    <h3 id="slotsTitle">Save</h3>
    <div id="slots"></div>
    <button value="cancel" class="ghost">Cancel</button>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script type="module" src="js/play.js"></script>
</body>
</html>
